[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cymraeg-bench"
version = "0.1.0"
description = "Open, reproducible benchmarks for evaluating AI models in Welsh"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "datasets>=2.19,<4",
  "sacrebleu>=2.4,<3",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[project.scripts]
cymraeg-bench = "aisteddfod_benchmarks.cli:main"
aisteddfod-bench = "aisteddfod_benchmarks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

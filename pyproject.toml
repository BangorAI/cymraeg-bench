[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cymraeg-bench"
version = "0.1.0"
description = "Open, reproducible benchmarks for evaluating AI models in Welsh"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "datasets>=2.19,<4",
  "sacrebleu>=2.4,<3",
]

[project.optional-dependencies]
voice-asr = [
  "faster-whisper==1.2.1",
  "kenlm==0.3.0",
  "librosa==0.11.0",
  "pyctcdecode==0.5.0",
  "sherpa-onnx==1.13.4",
  "transformers==4.57.6",
  "vosk==0.3.45",
]
voice-tts = [
  "piper-tts==1.6.0",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[project.scripts]
cymraeg-bench = "aisteddfod_benchmarks.cli:main"
aisteddfod-bench = "aisteddfod_benchmarks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
